name: Kaniko Build (ARC Hooks)

on:
  workflow_call:
    inputs:
      registry_url:
        required: true
        type: string
      name:
        required: true
        type: string
      dockerfile:
        type: string
        default: "./Dockerfile"
      push:
        type: boolean
        default: false
      tag:
        default: ""
        type: string

jobs:
  build:
    runs-on: app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: ${{ inputs.push }}
          tags: ${{ inputs.registry_url }}/${{ inputs.name }}:${{ inputs.tag }}
          cache-from: type=registry,ref=${{ inputs.registry_url }}/${{ inputs.name }}:buildcache
          cache-to: type=registry,ref=${{ inputs.registry_url }}/${{ inputs.name }}:buildcache,mode=max
